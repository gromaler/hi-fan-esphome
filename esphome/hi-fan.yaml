substitutions:
  # Replace these values for your device.
  hi_fan_mac: "AA:BB:CC:DD:EE:FF"
  # Authentication = 00 FB 03 + last three bytes of the BLE MAC.
  auth_b1: "0xDD"
  auth_b2: "0xEE"
  auth_b3: "0xFF"

esphome:
  name: hi-fan-gateway
  friendly_name: HI-FAN Gateway

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


# ============================================================
# INTERNAL STATE
# ============================================================

globals:

  # ---------------- LIGHT ----------------

  - id: hi_fan_light_on
    type: bool
    restore_value: no
    initial_value: "false"

  - id: hi_fan_light_state_known
    type: bool
    restore_value: no
    initial_value: "false"

  - id: hi_fan_brightness
    type: int
    restore_value: no
    initial_value: "100"

  # Color temperature protocol position:
  # 0   = 3000 K (warm)
  # 100 = 5500 K (cold)
  - id: hi_fan_color_temp
    type: int
    restore_value: no
    initial_value: "50"

  - id: hi_fan_restore_pending
    type: bool
    restore_value: no
    initial_value: "false"

  - id: hi_fan_sync_from_device
    type: bool
    restore_value: no
    initial_value: "false"


  # ---------------- BLE AUTH ----------------

  - id: hi_fan_authenticated
    type: bool
    restore_value: no
    initial_value: "false"


  # ---------------- FAN ----------------

  # Last confirmed fan speed:
  # 0 = OFF
  # 1..6 = speed
  - id: hi_fan_fan_speed
    type: int
    restore_value: no
    initial_value: "0"

  - id: hi_fan_fan_state_known
    type: bool
    restore_value: no
    initial_value: "false"

  # Feedback-loop protection:
  # device -> ESP -> HA
  - id: hi_fan_fan_sync_from_device
    type: bool
    restore_value: no
    initial_value: "false"



# ============================================================
# BLE
# ============================================================

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:

  - mac_address: ${hi_fan_mac}
    id: hi_fan
    auto_connect: true

    on_connect:
      then:

        - logger.log:
            level: INFO
            format: "=== HI-FAN CONNECTED ==="

        - lambda: |-
            id(hi_fan_authenticated) = false;

        - delay: 500ms

        - logger.log:
            level: INFO
            format: ">>> HI-FAN AUTO AUTH: 00-FB-03-${auth_b1}-${auth_b2}-${auth_b3}"

        - ble_client.ble_write:
            id: hi_fan
            service_uuid: "5746"
            characteristic_uuid: "5701"
            value: [0x00, 0xFB, 0x03, ${auth_b1}, ${auth_b2}, ${auth_b3}]


    on_disconnect:
      then:

        - logger.log:
            level: WARN
            format: "=== HI-FAN DISCONNECTED ==="

        # Arm immediately so even a short power blink is handled.
        # Only arm after a previously authenticated connection:
        # no forced OFF on first boot / before the first successful AUTH.
        - lambda: |-
            if (id(hi_fan_authenticated)) {
              id(hi_fan_restore_pending) = true;
              ESP_LOGW(
                "hi_fan",
                "Power Restore Guard armed: force LIGHT OFF after next AUTH"
              );
            }
            id(hi_fan_authenticated) = false;


# ============================================================
# LIGHT OUTPUT
# ============================================================

output:

  - platform: template
    id: hi_fan_light_output
    type: float

    write_action:

      - if:
          condition:
            lambda: |-
              return id(hi_fan_sync_from_device);

          then:

            - lambda: |-

                ESP_LOGD(
                  "hi_fan",
                  "HA light state sync from device - BLE write suppressed"
                );

          else:

            - if:
                condition:
                  lambda: |-
                    return state <= 0.0f;

                then:

                  - logger.log:
                      level: INFO
                      format: ">>> HA -> LIGHT OFF"

                  - ble_client.ble_write:
                      id: hi_fan
                      service_uuid: "5746"
                      characteristic_uuid: "5701"
                      value: [0x0F, 0x03, 0x01, 0x00]

                else:

                  - lambda: |-

                      int level =
                        (int) roundf(state * 100.0f);

                      if (level < 1)
                        level = 1;

                      if (level > 100)
                        level = 100;

                      ESP_LOGI(
                        "hi_fan",
                        ">>> HA -> LIGHT ON, brightness %d%%",
                        level
                      );

                  - ble_client.ble_write:
                      id: hi_fan
                      service_uuid: "5746"
                      characteristic_uuid: "5701"
                      value: [0x0F, 0x03, 0x01, 0x01]

                  - ble_client.ble_write:
                      id: hi_fan
                      service_uuid: "5746"
                      characteristic_uuid: "5701"

                      value: !lambda |-

                        int level =
                          (int) roundf(state * 100.0f);

                        if (level < 1)
                          level = 1;

                        if (level > 100)
                          level = 100;

                        return {
                          0x00,
                          0x0E,
                          0x01,
                          (uint8_t) level
                        };


  # ----------------------------------------------------------
  # COLOR TEMPERATURE OUTPUT
  #
  # ESPHome color_temperature output:
  #   state=0.0 -> cold end (5500 K)
  #   state=1.0 -> warm end (3000 K)
  #
  # HI-FAN protocol:
  #   00 -> 3000 K warm
  #   64 -> 5500 K cold
  #
  # ESPHome interpolates CT in mireds, so convert the normalized
  # output back to Kelvin before mapping it to the device's
  # linear 0..100 protocol scale.
  # ----------------------------------------------------------

  - platform: template
    id: hi_fan_color_temp_output
    type: float

    write_action:

      - if:
          condition:
            lambda: |-
              return id(hi_fan_sync_from_device);

          then:

            - lambda: |-
                ESP_LOGD(
                  "hi_fan",
                  "HA color temperature sync from device - BLE write suppressed"
                );

          else:

            - lambda: |-
                // ESPHome state: 0=cold, 1=warm, linear in mireds.
                const float cold_mired = 1000000.0f / 5500.0f;
                const float warm_mired = 1000000.0f / 3000.0f;

                float s = state;
                if (s < 0.0f) s = 0.0f;
                if (s > 1.0f) s = 1.0f;

                float mired =
                  cold_mired + s * (warm_mired - cold_mired);

                float kelvin =
                  1000000.0f / mired;

                int raw =
                  (int) roundf((kelvin - 3000.0f) / 25.0f);

                if (raw < 0) raw = 0;
                if (raw > 100) raw = 100;

                ESP_LOGI(
                  "hi_fan",
                  ">>> HA -> COLOR TEMP %.0f K (raw %d)",
                  kelvin,
                  raw
                );

            - ble_client.ble_write:
                id: hi_fan
                service_uuid: "5746"
                characteristic_uuid: "5701"

                value: !lambda |-
                  const float cold_mired = 1000000.0f / 5500.0f;
                  const float warm_mired = 1000000.0f / 3000.0f;

                  float s = state;
                  if (s < 0.0f) s = 0.0f;
                  if (s > 1.0f) s = 1.0f;

                  float mired =
                    cold_mired + s * (warm_mired - cold_mired);

                  float kelvin =
                    1000000.0f / mired;

                  int raw =
                    (int) roundf((kelvin - 3000.0f) / 25.0f);

                  if (raw < 0) raw = 0;
                  if (raw > 100) raw = 100;

                  return {
                    0x00,
                    0x0F,
                    0x01,
                    (uint8_t) raw
                  };


# ============================================================
# HOME ASSISTANT LIGHT
# ============================================================

light:

  - platform: color_temperature
    name: "HI-FAN Light"
    id: hi_fan_light

    brightness: hi_fan_light_output
    color_temperature: hi_fan_color_temp_output

    warm_white_color_temperature: 3000 K
    cold_white_color_temperature: 5500 K

    default_transition_length: 0s


# ============================================================
# HOME ASSISTANT FAN
#
# speed_count = 6
#
# OFF = 00 02 01 00
# 1   = 00 02 01 0A
# 2   = 00 02 01 14
# 3   = 00 02 01 1E
# 4   = 00 02 01 28
# 5   = 00 02 01 32
# 6   = 00 02 01 3C
#
# Direction intentionally not exposed in Home Assistant.
# ============================================================

fan:

  - platform: template
    name: "HI-FAN Fan"
    id: hi_fan_fan

    speed_count: 6
    has_direction: false
    has_oscillating: false

    restore_mode: NO_RESTORE


    # --------------------------------------------------------
    # ON
    #
    # When HA turns the fan on:
    # use the currently selected speed.
    # If speed is 0 for any reason, start at speed 1.
    # --------------------------------------------------------

    on_turn_on:
      then:

        - if:
            condition:
              lambda: |-
                return id(hi_fan_fan_sync_from_device);

            then:

              - logger.log:
                  level: DEBUG
                  format: "Fan ON sync from device - BLE write suppressed"

            else:

              - lambda: |-

                  int speed = id(hi_fan_fan).speed;

                  if (speed < 1)
                    speed = 1;

                  if (speed > 6)
                    speed = 6;

                  ESP_LOGI(
                    "hi_fan",
                    ">>> HA -> FAN ON speed %d",
                    speed
                  );

              - ble_client.ble_write:
                  id: hi_fan
                  service_uuid: "5746"
                  characteristic_uuid: "5701"

                  value: !lambda |-

                    int speed = id(hi_fan_fan).speed;

                    if (speed < 1)
                      speed = 1;

                    if (speed > 6)
                      speed = 6;

                    uint8_t value =
                      (uint8_t)(speed * 10);

                    return {
                      0x00,
                      0x02,
                      0x01,
                      value
                    };


    # --------------------------------------------------------
    # OFF
    # --------------------------------------------------------

    on_turn_off:
      then:

        - if:
            condition:
              lambda: |-
                return id(hi_fan_fan_sync_from_device);

            then:

              - logger.log:
                  level: DEBUG
                  format: "Fan OFF sync from device - BLE write suppressed"

            else:

              - logger.log:
                  level: INFO
                  format: ">>> HA -> FAN OFF"

              - ble_client.ble_write:
                  id: hi_fan
                  service_uuid: "5746"
                  characteristic_uuid: "5701"
                  value: [0x00, 0x02, 0x01, 0x00]


    # --------------------------------------------------------
    # SPEED 1..6
    # --------------------------------------------------------

    on_speed_set:
      then:

        - if:
            condition:
              lambda: |-
                return id(hi_fan_fan_sync_from_device);

            then:

              - lambda: |-

                  ESP_LOGD(
                    "hi_fan",
                    "Fan speed sync from device: %d - BLE write suppressed",
                    x
                  );

            else:

              - lambda: |-

                  int speed = x;

                  if (speed < 1)
                    speed = 1;

                  if (speed > 6)
                    speed = 6;

                  ESP_LOGI(
                    "hi_fan",
                    ">>> HA -> FAN SPEED %d",
                    speed
                  );

              - ble_client.ble_write:
                  id: hi_fan
                  service_uuid: "5746"
                  characteristic_uuid: "5701"

                  value: !lambda |-

                    int speed = x;

                    if (speed < 1)
                      speed = 1;

                    if (speed > 6)
                      speed = 6;

                    uint8_t value =
                      (uint8_t)(speed * 10);

                    return {
                      0x00,
                      0x02,
                      0x01,
                      value
                    };




# ============================================================
# MANUAL HEX INPUT
# ============================================================

text:

  - platform: template
    name: "HI-FAN TX HEX"
    id: hi_fan_tx_hex

    optimistic: true
    mode: text
    initial_value: "0F030101"


# ============================================================
# SCRIPTS
# ============================================================

script:

  # ----------------------------------------------------------
  # LIGHT POWER RESTORE GUARD: ALWAYS OFF AFTER RECONNECT
  # ----------------------------------------------------------

  - id: restore_light_off
    mode: restart

    then:

      - delay: 300ms

      - logger.log:
          level: WARN
          format: ">>> POWER RESTORE GUARD: LIGHT OFF"

      - ble_client.ble_write:
          id: hi_fan
          service_uuid: "5746"
          characteristic_uuid: "5701"
          value: [0x0F, 0x03, 0x01, 0x00]


  # ----------------------------------------------------------
  # LIGHT DEVICE -> HA
  # ----------------------------------------------------------

  - id: sync_light_from_device
    mode: restart

    parameters:
      state: bool
      brightness: int

    then:

      - lambda: |-

          id(hi_fan_sync_from_device) = true;

          ESP_LOGD(
            "hi_fan",
            "Sync HA light from device: state=%s brightness=%d%%",
            state ? "ON" : "OFF",
            brightness
          );

          auto call =
            id(hi_fan_light).make_call();

          call.set_state(state);

          if (brightness > 0) {

            call.set_brightness(
              brightness / 100.0f
            );

          }

          call.perform();

      - delay: 50ms

      - lambda: |-
          id(hi_fan_sync_from_device) = false;


  # ----------------------------------------------------------
  # COLOR TEMPERATURE DEVICE -> HA
  #
  # Device raw:
  #   0   = 3000 K warm
  #   100 = 5500 K cold
  # ----------------------------------------------------------

  - id: sync_color_temp_from_device
    mode: restart

    parameters:
      raw: int

    then:

      - lambda: |-
          int value = raw;

          if (value < 0)
            value = 0;

          if (value > 100)
            value = 100;

          float kelvin =
            3000.0f + (value * 25.0f);

          float mired =
            1000000.0f / kelvin;

          id(hi_fan_sync_from_device) = true;

          ESP_LOGD(
            "hi_fan",
            "Sync HA color temperature from device: raw=%d -> %.0f K",
            value,
            kelvin
          );

          auto call =
            id(hi_fan_light).make_call();

          call.set_color_temperature(mired);
          call.perform();

      - delay: 50ms

      - lambda: |-
          id(hi_fan_sync_from_device) = false;


# ============================================================
# HI-FAN 5703 NOTIFICATIONS
# ============================================================

text_sensor:

  - platform: ble_client
    ble_client_id: hi_fan

    id: hi_fan_notify
    name: "HI-FAN BLE Raw"

    internal: true

    service_uuid: "5746"
    characteristic_uuid: "5703"

    notify: true
    update_interval: never

    on_notify:
      then:

        - lambda: |-

            // ================================================
            // RAW LOG
            // ================================================

            std::string hex;
            char buf[4];

            for (size_t i = 0; i < x.size(); i++) {

              snprintf(
                buf,
                sizeof(buf),
                "%02X",
                (uint8_t) x[i]
              );

              if (i > 0)
                hex += "-";

              hex += buf;
            }

            ESP_LOGI(
              "hi_fan",
              "<<< RX 5703: %s (%u bytes)",
              hex.c_str(),
              (unsigned) x.size()
            );


            // ================================================
            // AUTH SUCCESS
            // ================================================

            if (
              x.size() == 6 &&
              (uint8_t)x[0] == 0x00 &&
              (uint8_t)x[1] == 0xFB &&
              (uint8_t)x[2] == 0x03 &&
              (uint8_t)x[3] == ${auth_b1} &&
              (uint8_t)x[4] == ${auth_b2} &&
              (uint8_t)x[5] == ${auth_b3}
            ) {

              id(hi_fan_authenticated) = true;

              ESP_LOGI(
                "hi_fan",
                "=== HI-FAN AUTHENTICATED ==="
              );


              // After a previously authenticated BLE session disconnects,
              // force LIGHT OFF on the next successful authentication.
              // This deliberately ignores the previous light state.
              if (id(hi_fan_restore_pending)) {
                ESP_LOGW(
                  "hi_fan",
                  "Power Restore Guard: forcing LIGHT OFF after reconnect"
                );
                id(hi_fan_restore_pending) = false;
                id(restore_light_off).execute();
              }

              return;
            }


            // ================================================
            // LIGHT ON / OFF
            //
            // 0F 03 01 00
            // 0F 03 01 01
            // ================================================

            if (
              x.size() == 4 &&
              (uint8_t)x[0] == 0x0F &&
              (uint8_t)x[1] == 0x03 &&
              (uint8_t)x[2] == 0x01
            ) {

              bool new_state =
                ((uint8_t)x[3] == 0x01);

              id(hi_fan_light_on) =
                new_state;

              id(hi_fan_light_state_known) =
                true;

              ESP_LOGI(
                "hi_fan",
                "LIGHT STATE FROM DEVICE: %s",
                new_state ? "ON" : "OFF"
              );

              id(sync_light_from_device).execute(
                new_state,
                id(hi_fan_brightness)
              );

              return;
            }


            // ================================================
            // LIGHT BRIGHTNESS
            //
            // 00 0E 01 XX
            // ================================================

            if (
              x.size() == 4 &&
              (uint8_t)x[0] == 0x00 &&
              (uint8_t)x[1] == 0x0E &&
              (uint8_t)x[2] == 0x01
            ) {

              int level =
                (uint8_t)x[3];

              if (level < 0)
                level = 0;

              if (level > 100)
                level = 100;

              id(hi_fan_brightness) =
                level;

              ESP_LOGI(
                "hi_fan",
                "BRIGHTNESS FROM DEVICE: %d%%",
                level
              );

              if (
                id(hi_fan_light_state_known)
              ) {

                id(sync_light_from_device).execute(
                  id(hi_fan_light_on),
                  level
                );

              }

              return;
            }


            // ================================================
            // COLOR TEMPERATURE
            //
            // 00 0F 01 XX
            //
            // XX = 0..100
            // 0   = 3000 K warm
            // 100 = 5500 K cold
            // ================================================

            if (
              x.size() == 4 &&
              (uint8_t)x[0] == 0x00 &&
              (uint8_t)x[1] == 0x0F &&
              (uint8_t)x[2] == 0x01
            ) {

              int raw =
                (uint8_t)x[3];

              if (raw < 0)
                raw = 0;

              if (raw > 100)
                raw = 100;

              id(hi_fan_color_temp) =
                raw;

              int kelvin =
                3000 + (raw * 25);

              ESP_LOGI(
                "hi_fan",
                "COLOR TEMP FROM DEVICE: raw=%d -> %d K",
                raw,
                kelvin
              );

              id(sync_color_temp_from_device).execute(
                raw
              );

              return;
            }


            // ================================================
            // NIGHT LIGHT
            //
            // 00 13 02 05 05
            //
            // Native remote button 小夜灯.
            // The controller does not additionally report
            // normal light ON or brightness, so mirror it to HA
            // as ON at 5% without writing back to BLE.
            // ================================================

            if (
              x.size() == 5 &&
              (uint8_t)x[0] == 0x00 &&
              (uint8_t)x[1] == 0x13 &&
              (uint8_t)x[2] == 0x02 &&
              (uint8_t)x[3] == 0x05 &&
              (uint8_t)x[4] == 0x05
            ) {

              ESP_LOGI(
                "hi_fan",
                "NIGHT LIGHT FROM DEVICE"
              );

              id(hi_fan_light_on) = true;
              id(hi_fan_light_state_known) = true;
              id(hi_fan_brightness) = 5;

              id(sync_light_from_device).execute(
                true,
                5
              );

              return;
            }


            // ================================================
            // FAN SPEED / OFF
            //
            // 00 02 01 00 = OFF
            // 00 02 01 0A = speed 1
            // 00 02 01 14 = speed 2
            // ...
            // 00 02 01 3C = speed 6
            // ================================================

            if (
              x.size() == 4 &&
              (uint8_t)x[0] == 0x00 &&
              (uint8_t)x[1] == 0x02 &&
              (uint8_t)x[2] == 0x01
            ) {

              int raw =
                (uint8_t)x[3];

              int speed = 0;

              if (raw > 0) {

                speed =
                  (int) roundf(
                    raw / 10.0f
                  );

                if (speed < 1)
                  speed = 1;

                if (speed > 6)
                  speed = 6;

              }

              id(hi_fan_fan_speed) =
                speed;